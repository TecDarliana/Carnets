name: Sincronizar Repositorios

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  git-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código actual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Sin esto, la cabecera de auth de checkout anula el PAT del remote
          persist-credentials: false

      - name: Sincronizar hacia Fundayacucho
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add destino "https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/fundayacucho/carnets-bd-siglas.git"
          git push destino main:main
