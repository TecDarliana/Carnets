{% extends 'base.html' %}
{% block title %}Eliminar carnet{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">
    <div class="card shadow-sm border-danger">
      <div class="card-body">
        <h1 class="h5 text-danger">Eliminar carnet</h1>
        <p>¿Confirmas eliminar el carnet <strong>{{ object.numero }}</strong> de {{ object.empleado.nombre_completo }}?</p>
        <form method="post" class="d-flex justify-content-end gap-2">
          {% csrf_token %}
          <a href="{% url 'carnets:detalle' object.pk %}" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-danger">Eliminar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
