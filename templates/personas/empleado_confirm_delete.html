{% extends 'base.html' %}
{% block title %}Eliminar empleado{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">
    <div class="card shadow-sm border-danger">
      <div class="card-body">
        <h1 class="h5 text-danger">Eliminar empleado</h1>
        <p>¿Confirmas eliminar a <strong>{{ object.nombre_completo }}</strong>? Esta acción no se puede deshacer.</p>
        <form method="post" class="d-flex justify-content-end gap-2">
          {% csrf_token %}
          <a href="{% url 'personas:detalle' object.pk %}" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-danger">Eliminar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
